name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

  security-audit:
    runs-on: ubuntu-latest
    # Advisory: semnalează CVE-uri noi în dependențe fără să blocheze merge-ul
    # pentru vulnerabilități care nu au încă fix publicat.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
